name: Build AI Meetings

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build WhisperService
      run: |
        dotnet publish whisper_service/WhisperService.csproj -c Release -r win-x64 --self-contained true -o data/whisper_service

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v
      env:
        PYTHONPATH: .

    - name: Build PyInstaller executable
      run: |
        python -m PyInstaller AI_Meetings.spec --clean

    - name: Build Inno Setup Installer
      run: |
        cd installer
        .\build_now.ps1

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI_Meetings_Installer
        path: dist/AI_Meetings_Setup_v*.exe
        retention-days: 7
