name: Build AI Meetings

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:

  # ── Job 1: Tests ────────────────────────────────────────────────────────────
  # Лёгкий job — не требует ML-библиотек и .NET.
  # Запускается параллельно с build-whisper.
  test:
    name: Run tests
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements-test.txt

    - name: Install test dependencies
      run: pip install -r requirements-test.txt

    - name: Run tests
      run: python -m pytest tests/ -v
      env:
        PYTHONPATH: .

  # ── Job 2: Build WhisperService ─────────────────────────────────────────────
  # .NET 8 publish — параллельно с тестами.
  # Артефакт передаётся в build-installer через upload/download artifact.
  build-whisper:
    name: Build WhisperService (.NET 8)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('whisper_service/**/*.csproj') }}
        restore-keys: nuget-

    - name: Publish WhisperService
      run: >
        dotnet publish whisper_service/WhisperService.csproj
        -c Release -r win-x64 --self-contained true
        -o data/whisper_service

    - name: Upload WhisperService artifact
      uses: actions/upload-artifact@v4
      with:
        name: whisper-service-bin
        path: data/whisper_service/
        retention-days: 1

  # ── Job 3: Build installer ──────────────────────────────────────────────────
  # Запускается только если test и build-whisper прошли успешно.
  build-installer:
    name: Build installer
    runs-on: windows-latest
    needs: [ test, build-whisper ]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install build dependencies
      run: |
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Download WhisperService artifact
      uses: actions/download-artifact@v4
      with:
        name: whisper-service-bin
        path: data/whisper_service/

    - name: Build PyInstaller executable
      run: python -m PyInstaller AI_Meetings.spec --clean

    - name: Build Inno Setup installer
      run: |
        cd installer
        .\build_now.ps1

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI_Meetings_Installer
        path: dist/AI_Meetings_Setup_v*.exe
        retention-days: 7
